[project]
name = "regime-vol-forecast"
version = "0.1.0"
description = "Do causal HMM regime probabilities improve out-of-sample daily volatility forecasts?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch>=7",
    "hmm-regime==0.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
