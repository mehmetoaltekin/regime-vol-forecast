[project]
name = "regime-vol-forecast"
version = "0.1.0"
description = "Do causal HMM regime probabilities improve out-of-sample daily volatility forecasts?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch==9.0.0",
    "hmm-regime==0.2.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
